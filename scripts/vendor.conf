# scripts/vendor.conf
# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Co-located, non-squash git-subtree vendoring of the proposal dependencies.
# One row per subtree prefix. The prefix is IDENTICAL to the path inside the
# upstream repo, which is what makes edits round-trip: our commits/diffs touch
# `include/beman/<lib>/...` and `tests/beman/<lib>/...`, so they apply directly
# onto the upstream repository.
#
# Columns (whitespace-separated):
#   lib   remote_url                                   upstream_branch   prefix
#
# The git remote for <lib> is named "beman-<lib>" and is added automatically by
# the vendor-*.sh scripts if missing.

optional  https://github.com/bemanproject/optional  main  include/beman/optional
optional  https://github.com/bemanproject/optional  main  tests/beman/optional
expected  https://github.com/bemanproject/expected  main  include/beman/expected
expected  https://github.com/bemanproject/expected  main  tests/beman/expected
